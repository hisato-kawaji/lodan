[package]
name = "lodan"
version = "0.1.0"
edition = "2024"
description = "Local-LLM coding agent inspired by Claude Code"
license = "MIT OR Apache-2.0"

[lib]
name = "lodan"
path = "src/lib.rs"

[[bin]]
name = "lodan"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
eventsource-stream = "0.2"
futures-util = "0.3"

clap = { version = "4", features = ["derive", "env"] }
rustyline = "14"

ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
globset = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
dotenvy = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
